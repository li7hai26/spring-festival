<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>春节主题活动</title>
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <!-- 烟花和粒子特效背景 -->
    <canvas id="fireworksCanvas" class="fireworks-canvas"></canvas>

    <!-- 左侧对联 -->
    <div class="couplet-left">
        <div class="couplet-text" id="coupletLeftText"></div>
        <div class="couplet-loading" id="coupletLoading">
            <div class="couplet-spinner"></div>
        </div>
    </div>

    <!-- 右侧对联 -->
    <div class="couplet-right">
        <div class="couplet-text" id="coupletRightText"></div>
    </div>

    <!-- 右上角按钮组 -->
    <div class="top-buttons">
        <button id="configBtn" class="config-button">⚙️</button>
    </div>

    <!-- 主导航 -->
    <div class="main-container">
        <header class="main-header">
            <h1>🧧 春节主题活动 🏮</h1>
            <p class="subtitle">探索春节文化，创作年兽故事</p>
        </header>

        <div class="module-grid">
            <a href="story.html" class="module-card">
                <div class="module-icon">📜</div>
                <h2>春节年兽故事生成器</h2>
                <p>用 AI 创作属于你的春节年兽传说</p>
                <div class="module-arrow">→</div>
            </a>

            <a href="customs.html" class="module-card">
                <div class="module-icon">🏮</div>
                <h2>春节习俗查询</h2>
                <p>探索全国各地的春节传统习俗和礼仪</p>
                <div class="module-arrow">→</div>
            </a>
        </div>

        <!-- 春节倒计时 -->
        <div class="countdown-container">
            <h2>🎊 距离2026年春节还有</h2>
            <div class="countdown" id="countdown">
                <div class="countdown-item">
                    <span class="countdown-number" id="countdownDays">0</span>
                    <span class="countdown-label">天</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="countdownHours">0</span>
                    <span class="countdown-label">时</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="countdownMinutes">0</span>
                    <span class="countdown-label">分</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="countdownSeconds">0</span>
                    <span class="countdown-label">秒</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 配置模态框 -->
    <div id="configModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⚙️ 配置 API</h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="api-info">
                <p>💡 使用 <code>https://apis.iflow.cn/v1</code> 时，前往 <a href="https://platform.iflow.cn/profile?tab=apiKey" target="_blank">platform.iflow.cn</a> 获取 API Key</p>
            </div>
            <form id="configForm" class="config-form">
                <div class="form-group">
                    <label for="apiUrl">API URL</label>
                    <input type="url" id="apiUrl" placeholder="https://apis.iflow.cn/v1" required>
                </div>
                <div class="form-group">
                    <label for="apiKey">API Key</label>
                    <input type="password" id="apiKey" placeholder="sk-..." required>
                </div>
                <div class="form-group">
                    <label for="modelName">模型名称</label>
                    <input type="text" id="modelName" placeholder="iflow-rome-30ba3b" required>
                </div>
                <button type="submit" class="btn btn-primary">💾 保存配置</button>
            </form>
            <div id="configStatus" class="status-message"></div>
        </div>
    </div>

    <footer class="footer">
        <p>🚀 使用 <strong>iflow CLI</strong> 创作</p>
        <p class="footer-thanks">感谢 iflow CLI 的大力支持 ❤️</p>
    </footer>

    <script src="common.js"></script>
</body>
</html>
